<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recall Lab — 召回实验台</title>
  <style>
    :root {
      --paper: #f0eadd;
      --ink: #0c0f12;
      --panel: #111519;
      --panel-2: #171d21;
      --line: rgba(12, 15, 18, 0.16);
      --line-dark: rgba(240, 234, 221, 0.14);
      --amber: #f3a712;
      --cyan: #35cdb5;
      --red: #ec5b4b;
      --muted: #6f746f;
      --display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --mono: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 12%, rgba(243, 167, 18, 0.12), transparent 28rem),
        linear-gradient(135deg, rgba(12, 15, 18, 0.035) 25%, transparent 25%) 0 0 / 22px 22px,
        var(--paper);
      font-family: var(--mono);
      min-height: 100vh;
    }

    .shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 38px clamp(20px, 4vw, 64px) 80px;
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      border-bottom: 3px solid var(--ink);
      padding-bottom: 18px;
      margin-bottom: 28px;
      animation: rise 0.55s ease both;
    }

    .kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(44px, 8vw, 104px);
      font-weight: 500;
      line-height: 0.86;
      letter-spacing: -0.05em;
    }

    .masthead .meta {
      text-align: right;
      font-size: 11px;
      line-height: 1.7;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    aside {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .run-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 180px);
      overflow: auto;
      padding-right: 4px;
    }

    .run-card {
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.42);
      padding: 13px 14px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      animation: rise 0.45s ease both;
    }

    .run-card:hover {
      transform: translateY(-1px);
      border-color: var(--ink);
    }

    .run-card.selected {
      background: var(--panel);
      color: var(--paper);
      border-color: var(--amber);
      box-shadow: 6px 6px 0 var(--amber);
    }

    .run-card .title {
      font-family: var(--display);
      font-size: 18px;
      margin-bottom: 6px;
    }

    .run-card .sub {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.5;
    }

    .run-card.selected .sub { color: rgba(240, 234, 221, 0.58); }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid var(--ink);
      background: transparent;
      color: inherit;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    button:hover {
      background: var(--ink);
      color: var(--paper);
      transform: translateY(-1px);
    }

    button.primary {
      background: var(--amber);
      border-color: var(--ink);
      color: var(--ink);
    }

    main {
      min-width: 0;
    }

    .empty {
      min-height: 420px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-family: var(--display);
      font-size: 30px;
      text-align: center;
      padding: 40px;
      animation: rise 0.5s ease both;
    }

    .panel {
      background: var(--panel);
      color: var(--paper);
      padding: 24px;
      margin-bottom: 18px;
      border: 1px solid var(--ink);
      box-shadow: 10px 10px 0 rgba(12, 15, 18, 0.12);
      animation: rise 0.5s ease both;
    }

    .panel h2 {
      margin: 0 0 18px;
      font-family: var(--display);
      font-weight: 500;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      white-space: nowrap;
    }

    th, td {
      text-align: right;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-dark);
    }

    th:first-child, td:first-child {
      text-align: left;
      color: var(--amber);
    }

    thead th {
      color: rgba(240, 234, 221, 0.55);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 10px;
    }

    .metric-bar {
      display: inline-block;
      height: 6px;
      background: var(--cyan);
      vertical-align: middle;
      margin-left: 8px;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .rank-cell {
      border: 1px solid var(--line-dark);
      padding: 12px;
      text-align: center;
    }

    .rank-cell b {
      display: block;
      font-family: var(--display);
      font-size: 34px;
      font-weight: 500;
      color: var(--amber);
    }

    .rank-cell span {
      font-size: 10px;
      color: rgba(240, 234, 221, 0.55);
    }

    .detail-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }

    select, input {
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 10px;
      border: 1px solid var(--line-dark);
      background: var(--panel-2);
      color: var(--paper);
      min-width: 180px;
    }

    .question {
      border: 1px solid var(--line-dark);
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .question:hover, .question.active {
      border-color: var(--cyan);
      background: var(--panel-2);
    }

    .question .q-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 10px;
      color: rgba(240, 234, 221, 0.55);
      margin-top: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border: 1px solid currentColor;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge.gold { color: var(--amber); }
    .badge.miss { color: var(--red); }
    .badge.hit { color: var(--cyan); }

    .candidate {
      border-left: 3px solid var(--line-dark);
      padding: 12px 14px;
      margin: 8px 0;
      font-size: 11px;
      line-height: 1.55;
    }

    .candidate.hit {
      border-left-color: var(--cyan);
      background: rgba(53, 205, 181, 0.08);
    }

    .candidate .rank {
      color: var(--amber);
      font-family: var(--display);
      font-size: 20px;
      margin-right: 8px;
    }

    .candidate pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 6px 0 0;
      font-family: var(--mono);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; }
      .run-list { max-height: none; }
      .rank-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div>
        <div class="kicker">LightRAG · Retrieval Diagnostics</div>
        <h1>Recall Lab</h1>
      </div>
      <div class="meta">
        只测召回，不跑回答<br />
        观察 gold 从 Rank N 到 Rank 1 的过程
      </div>
    </header>

    <div class="layout">
      <aside>
        <div class="section-label">实验运行</div>
        <div class="run-list" id="run-list"></div>
        <div class="actions">
          <button class="primary" id="compare-btn">对比选中运行</button>
          <button id="clear-btn">清空</button>
        </div>
      </aside>

      <main>
        <div class="empty" id="empty-state">
          在左侧选择至少一个召回运行
        </div>
        <div id="results" style="display:none">
          <section class="panel" id="overview"></section>
          <section class="panel" id="question-types"></section>
          <section class="panel" id="rank-distribution"></section>
          <section class="panel" id="case-detail"></section>
        </div>
      </main>
    </div>
  </div>

  <script>
    const state = { runs: [], selected: new Set(), compare: [] };
    const $ = (id) => document.getElementById(id);

    async function json(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function loadRuns() {
      const { runs } = await json('/api/runs');
      state.runs = runs;
      renderRunList();
    }

    function renderRunList() {
      const list = $('run-list');
      list.innerHTML = '';
      if (!state.runs.length) {
        list.innerHTML = '<div class="run-card"><div class="title">暂无运行</div><div class="sub">先运行 python -m memory_recall_lab.run</div></div>';
        return;
      }
      state.runs.forEach((run, index) => {
        const card = document.createElement('div');
        card.className = 'run-card' + (state.selected.has(run.path) ? ' selected' : '');
        card.style.animationDelay = `${Math.min(index * 25, 260)}ms`;
        const baseline = run.baseline || {};
        card.innerHTML = `
          <div class="title">${escapeHtml(run.label || run.id)}</div>
          <div class="sub">${escapeHtml(run.dataset || '—')}<br>${escapeHtml((baseline.mode || 'naive'))} · top_k=${baseline.top_k ?? '—'} · ${escapeHtml(run.status || '')}</div>
        `;
        card.addEventListener('click', () => toggleRun(run.path));
        list.appendChild(card);
      });
    }

    function toggleRun(path) {
      if (state.selected.has(path)) state.selected.delete(path);
      else state.selected.add(path);
      renderRunList();
    }

    async function compare() {
      if (!state.selected.size) return;
      const paths = [...state.selected].map(encodeURIComponent).join('&path=');
      const { runs } = await json('/api/compare?path=' + paths);
      state.compare = runs;
      renderResults();
    }

    function renderResults() {
      $('empty-state').style.display = 'none';
      $('results').style.display = 'block';
      renderOverview();
      renderQuestionTypes();
      renderRankDistribution();
      renderCaseDetail();
    }

    function renderOverview() {
      const runs = state.compare.filter(r => r.recall);
      if (!runs.length) return;
      const metrics = [
        ['Recall@1', 'recall_at_1'],
        ['Recall@3', 'recall_at_3'],
        ['Recall@5', 'recall_at_5'],
        ['Recall@K', 'recall_at_k'],
        ['MRR', 'mrr'],
        ['Mean Fact MRR', 'mean_fact_mrr'],
        ['Full @1', 'full_recall_at_1'],
        ['Full @3', 'full_recall_at_3'],
      ];
      let html = '<h2>总体召回</h2><div class="table-scroll"><table><thead><tr><th>指标</th>';
      runs.forEach(r => html += `<th>${escapeHtml(r.label || r.id)}</th>`);
      html += '</tr></thead><tbody>';
      metrics.forEach(([label, key]) => {
        html += `<tr><td>${label}</td>`;
        runs.forEach(run => {
          const v = run.recall.summary.overall[key];
          html += `<td>${formatMetric(v, key)}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      $('overview').innerHTML = html;
    }

    function renderQuestionTypes() {
      const runs = state.compare.filter(r => r.recall);
      const types = new Set();
      runs.forEach(run => Object.keys(run.recall.summary.by_question_type).forEach(t => types.add(t)));
      const ordered = [...types].sort();
      let html = '<h2>按题型</h2><div class="table-scroll"><table><thead><tr><th>题型</th>';
      runs.forEach(r => html += `<th>R@1 / R@3 / R@5</th>`);
      html += '</tr></thead><tbody>';
      ordered.forEach(type => {
        html += `<tr><td>${escapeHtml(type)}</td>`;
        runs.forEach(run => {
          const m = run.recall.summary.by_question_type[type];
          html += `<td>${m ? `${pct(m.recall_at_1)} / ${pct(m.recall_at_3)} / ${pct(m.recall_at_5)}` : '—'}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      $('question-types').innerHTML = html;
    }

    function renderRankDistribution() {
      const runs = state.compare.filter(r => r.recall);
      if (!runs.length) return;
      const first = runs[0];
      const dist = first.recall.summary.overall.gold_rank_distribution || {};
      const labels = [['1', 'Rank 1'], ['2', 'Rank 2'], ['3', 'Rank 3'], ['4_5', 'Rank 4–5'], ['6_10', 'Rank 6–10'], ['11_plus', 'Rank 11+'], ['miss', 'Miss']];
      let html = '<h2>Gold Rank 分布</h2>';
      runs.forEach(run => {
        html += `<h3 style="font-family:var(--display);font-size:20px;margin:0 0 14px">${escapeHtml(run.label || run.id)}</h3><div class="rank-grid">`;
        labels.forEach(([key, label]) => {
          const value = run.recall.summary.overall.gold_rank_distribution?.[key] ?? 0;
          html += `<div class="rank-cell"><b>${value}</b><span>${label}</span></div>`;
        });
        html += '</div>';
      });
      $('rank-distribution').innerHTML = html;
    }

    function renderCaseDetail() {
      const run = state.compare.find(r => r.recall);
      if (!run) return;
      const questions = run.recall.results || [];
      const types = [...new Set(questions.map(q => q.question_type))].sort();
      let html = `
        <h2>逐题 Ranking</h2>
        <div class="detail-head">
          <div>
            <select id="detail-run">${state.compare.map(r => `<option value="${r.id}">${escapeHtml(r.label || r.id)}</option>`).join('')}</select>
            <select id="detail-type"><option value="">全部题型</option>${types.map(t => `<option>${escapeHtml(t)}</option>`).join('')}</select>
          </div>
          <div><span class="badge gold">Gold rank</span> <span class="badge hit">命中候选</span> <span class="badge miss">未命中</span></div>
        </div>
        <div id="question-list"></div>
        <div id="candidate-list"></div>
      `;
      $('case-detail').innerHTML = html;
      $('detail-run').addEventListener('change', e => {
        const target = state.compare.find(r => r.id === e.target.value);
        if (target) { renderCaseDetailForRun(target); }
      });
      $('detail-type').addEventListener('change', e => {
        renderQuestionListForRun(state.compare.find(r => r.id === $('detail-run').value), e.target.value);
      });
      renderCaseDetailForRun(run);
    }

    function renderCaseDetailForRun(run) {
      const type = $('detail-type').value;
      renderQuestionListForRun(run, type);
    }

    function renderQuestionListForRun(run, type) {
      const questions = (run.recall.results || []).filter(q => !type || q.question_type === type);
      const box = $('question-list');
      $('candidate-list').innerHTML = '';
      if (!questions.length) { box.innerHTML = '<div class="candidate">没有符合条件的题目。</div>'; return; }
      box.innerHTML = '';
      questions.forEach((q, i) => {
        const rank = q.first_evidence_rank;
        const badge = rank == null ? '<span class="badge miss">Miss</span>' : `<span class="badge gold">Rank ${rank}</span>`;
        const div = document.createElement('div');
        div.className = 'question';
        div.innerHTML = `<strong>${escapeHtml(q.question_id)}</strong> · ${escapeHtml(q.question_type)}<br>${escapeHtml(q.question)}<div class="q-meta">${badge}<span>${q.expected_fact_ids.map(escapeHtml).join(' + ')}</span></div>`;
        div.addEventListener('click', () => {
          document.querySelectorAll('.question').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          renderCandidates(q);
        });
        box.appendChild(div);
      });
      renderCandidates(questions[0]);
      const first = questions[0];
      const active = document.querySelectorAll('.question')[0];
      if (active) active.classList.add('active');
    }

    function renderCandidates(q) {
      const box = $('candidate-list');
      box.innerHTML = `<div style="font-family:var(--display);font-size:22px;margin-bottom:12px">${escapeHtml(q.question_id)}</div>`;
      q.candidates.forEach(c => {
        const div = document.createElement('div');
        div.className = 'candidate' + (c.matched_fact_ids.length ? ' hit' : '');
        div.innerHTML = `<span class="rank">${String(c.rank).padStart(2, '0')}</span>${c.chunk_id || c.file_path}${c.matched_fact_ids.length ? ' · ' + c.matched_fact_ids.join(', ') : ''}<pre>${escapeHtml(c.content_excerpt)}</pre>`;
        box.appendChild(div);
      });
    }

    function pct(value) {
      return (value == null ? '—' : (value * 100).toFixed(1) + '%');
    }

    function formatMetric(value, key) {
      if (value == null) return '—';
      if (key.startsWith('full_')) return String(value);
      if (key === 'mrr' || key === 'mean_fact_mrr') return value.toFixed(3);
      return pct(value);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    $('compare-btn').addEventListener('click', compare);
    $('clear-btn').addEventListener('click', () => {
      state.selected.clear();
      state.compare = [];
      $('results').style.display = 'none';
      $('empty-state').style.display = 'grid';
      renderRunList();
    });

    loadRuns();
  </script>
</body>
</html>
